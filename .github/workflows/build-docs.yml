name: Create Docs
on: [push]
jobs:
  docs:
    name: Build docs from JSDoc
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN read permissions only
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate docs
        run: npm run docs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: Update docs based on TypeDocs
          title: 'docs: Update TypeDocs'
          body: 'Automated update of documentation from TypeDocs'
          branch: docs/update-typedocs
