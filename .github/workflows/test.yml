name: Test
on: [push, pull_request]
jobs:
  test:
    name: Test Repo
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN read permissions only
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }} # Ensure it fetches the correct ref

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm test
