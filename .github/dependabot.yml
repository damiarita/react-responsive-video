version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    # Look for `package.json` and `lock` files in the `root` directory
    directory: '/'
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: 'daily'
    groups:
      babel-packages:
        patterns:
          - '@babel/*'
      eslint-packages:
        patterns:
          - '@eslint/*'
          - 'eslint'
          - '@typescript-eslint/*'
          - 'eslint-*'
      jest-packages:
        patterns:
          - 'jest*'
          - 'babel-jest'
          - '@types/jest'
      react-packages:
        patterns:
          - 'react*'
          - '@testing-library/react'
      typescript-packages:
        patterns:
          - 'typescript'
          - 'typedoc*'
  # Enable version updates for GitHub Actions used in the workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
